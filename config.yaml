data_dir: data
results_dir: results

cv:
  n_splits: 5
  random_state: 42

tfidf:
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2

embedding:
  provider: openai
  model_name: text-embedding-3-small
  batch_size: 64
  normalize_embeddings: true
  cache_dir: results/embeddings

models:
  classification:
    - lr
    - svc
    - ridge
  regression:
    - lr
    - ridge

embedding_models:
  classification:
    - lr
    - svc
    - rf
  regression:
    - ridge
    - svr
    - rfr
